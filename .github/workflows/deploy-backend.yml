name: Deploy Backend (Google Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-southeast1' }}
  IMAGE_REGISTRY: gcr.io

jobs:
  # ─── Backend Gateway ──────────────────────────────────────────────────────
  deploy-backend-gateway:
    name: Deploy Backend Gateway → Cloud Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build & push Backend Gateway image
        run: |
          IMAGE_TAG="${IMAGE_REGISTRY}/${GCP_PROJECT_ID}/finsim-backend-gateway:${{ github.sha }}"
          docker build -t "${IMAGE_TAG}" -f apps/backend_gateway/Dockerfile .
          docker push "${IMAGE_TAG}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: finsim-backend-gateway
          image: "${IMAGE_REGISTRY}/${GCP_PROJECT_ID}/finsim-backend-gateway:${{ github.sha }}"
          region: ${{ env.GCP_REGION }}
          platform: managed
          allow-unauthenticated: true
          env-vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_URL_SYNC=${{ secrets.DATABASE_URL_SYNC }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ALGORITHM=HS256
            ACCESS_TOKEN_EXPIRE_MINUTES=60
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVIRONMENT=production
            DEBUG=false
          min-instances: 1
          max-instances: 10
          cpu: 1
          memory: 512Mi
          concurrency: 80
          timeout: 300

  # ─── Math Engine ──────────────────────────────────────────────────────────
  deploy-math-engine:
    name: Deploy Math Engine → Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-backend-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build & push Math Engine image
        run: |
          IMAGE_TAG="${IMAGE_REGISTRY}/${GCP_PROJECT_ID}/finsim-math-engine:${{ github.sha }}"
          docker build -t "${IMAGE_TAG}" -f apps/math_engine/Dockerfile .
          docker push "${IMAGE_TAG}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: finsim-math-engine
          image: "${IMAGE_REGISTRY}/${GCP_PROJECT_ID}/finsim-math-engine:${{ github.sha }}"
          region: ${{ env.GCP_REGION }}
          platform: managed
          allow-unauthenticated: true
          min-instances: 1
          max-instances: 5
          cpu: 1
          memory: 512Mi
          concurrency: 100
          timeout: 300

  # ─── AI Engine ────────────────────────────────────────────────────────────
  deploy-ai-engine:
    name: Deploy AI Engine → Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-math-engine

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build & push AI Engine image
        run: |
          IMAGE_TAG="${IMAGE_REGISTRY}/${GCP_PROJECT_ID}/finsim-ai-engine:${{ github.sha }}"
          docker build -t "${IMAGE_TAG}" -f apps/ai_engine/Dockerfile .
          docker push "${IMAGE_TAG}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: finsim-ai-engine
          image: "${IMAGE_REGISTRY}/${GCP_PROJECT_ID}/finsim-ai-engine:${{ github.sha }}"
          region: ${{ env.GCP_REGION }}
          platform: managed
          allow-unauthenticated: true
          env-vars: |
            REDIS_URL=${{ secrets.REDIS_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_RATE_LIMIT_RPM=${{ secrets.GEMINI_RATE_LIMIT_RPM || '15' }}
            GEMINI_RATE_LIMIT_BURST=${{ secrets.GEMINI_RATE_LIMIT_BURST || '5' }}
            GEMINI_RATE_LIMIT_MAX_WAIT_SECONDS=${{ secrets.GEMINI_RATE_LIMIT_MAX_WAIT_SECONDS || '90' }}
            ENVIRONMENT=production
            DEBUG=false
          min-instances: 0
          max-instances: 5
          cpu: 1
          memory: 512Mi
          concurrency: 80
          timeout: 300
