name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ─── Python: lint + typecheck + test ──────────────────────────────────────
  python:
    name: Python (ruff / mypy / pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --dev

      # ── Ruff ──
      - name: Ruff lint
        run: uv run ruff check apps/backend_gateway apps/math_engine apps/ai_engine scripts --exclude apps/backend_gateway/clients/proto --exclude apps/math_engine/grpc_services/math_engine_pb2.py --exclude apps/math_engine/grpc_services/math_engine_pb2_grpc.py

      # ── Pytest (all 3 Python apps) ──
      - name: Pytest — backend_gateway
        working-directory: apps/backend_gateway
        run: uv run pytest tests/ -q

      - name: Pytest — math_engine
        working-directory: apps/math_engine
        run: uv run pytest tests/ -q

      - name: Pytest — ai_engine
        working-directory: apps/ai_engine
        run: uv run pytest tests/ -q

  # ─── Frontend: lint + typecheck + build ───────────────────────────────────
  frontend:
    name: Frontend (lint / typecheck / build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspaces: lockfile ở repo root (chứa cả apps/frontend + packages/shared-types).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Build (production)
        working-directory: apps/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
