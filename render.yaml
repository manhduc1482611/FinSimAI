# ═══════════════════════════════════════════════════════════════════════════════
# FinSimAI — Render Blueprint
# 100% Free Tier deploy: 3 web services (gRPC/private services & background
# workers không có free instance trên Render — xem https://render.com/docs/free).
# ARQ worker chạy song song trong container ai-engine-api.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── 1. Math Engine (HTTP web service) ────────────────────────────────────
  # Trước là gRPC private service; Render không hỗ trợ gRPC trên public web
  # services và private service không có free tier → chuyển sang FastAPI HTTP.
  # Backend Gateway gọi qua: MATH_ENGINE_URL=https://<tên>.onrender.com
  - name: math-engine
    type: webService
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: apps/math_engine/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      # Shared secret giữa Backend Gateway và Math Engine. Đặt CÙNG giá trị ở cả
      # 3 service (backend-gateway, math-engine, ai-engine-api). Production thiếu
      # biến này → Math Engine từ chối mọi request /api/v1 (fail-closed).
      - key: INTERNAL_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

  # ── 2. AI Engine API + Worker — Web Service ─────────────────────────────
  # FastAPI web server (main_ai.py) + ARQ background worker (tasks.worker)
  # chạy chung một container free (start.sh — không cần dockerCommand vì
  # Render chạy dockerCommand như một command word đơn, không split shell).
  # Worker cào tin + sinh scenario + social posts.
  - name: ai-engine-api
    type: webService
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: apps/ai_engine/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      # URL công khai của Backend Gateway để AI Engine đẩy nội dung về
      # /api/v1/ai/content (kèm X-Internal-Api-Key).
      - key: BACKEND_GATEWAY_URL
        sync: false
      - key: GEMINI_RATE_LIMIT_RPM
        value: "15"
      - key: GEMINI_RATE_LIMIT_BURST
        value: "5"
      - key: GEMINI_RATE_LIMIT_MAX_WAIT_SECONDS
        value: "90"

  # ── 3. Backend Gateway — Web Service ─────────────────────────────────────
  # FastAPI web server + WebSocket realtime layer.
  # Đây là API Gateway duy nhất mà Frontend (Vercel) gọi tới.
  - name: backend-gateway
    type: webService
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: apps/backend_gateway/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      # --- Database (Render PostgreSQL) ---
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false

      # --- Redis (Render Key Value) ---
      # Free tier chạy 1 instance → bật WS_LOCAL_MODE=true để WebSocket hoạt
      # động không cần Redis (backplane/ticket store chạy trong RAM).
      - key: REDIS_URL
        sync: false
      - key: WS_LOCAL_MODE
        value: "true"

      # --- Gemini AI (Mentor fallback & insights) ---
      - key: GEMINI_API_KEY
        sync: false

      # --- Auth / Security ---
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Danh sách email được quyền admin (phân cách bằng dấu phẩy) —
      # thiếu biến này sẽ không có tài khoản nào giữ role admin.
      - key: ADMIN_EMAILS
        sync: false

      # --- CORS (phải bao gồm domain Vercel frontend) ---
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: FRONTEND_URL
        sync: false

      # --- Internal service reference (HTTP) ---
      - key: MATH_ENGINE_URL
        sync: false

      # Shared secret để gateway gọi Math Engine & AI Engine, và để AI Engine
      # đẩy nội dung về /api/v1/ai/content. CÙNG giá trị ở cả 3 service.
      - key: INTERNAL_API_KEY
        sync: false

      # --- Mentor (mặc định deterministic 0 token; bật LLM mới tốn lượt Gemini) ---
      - key: MENTOR_LLM_MODE
        value: "off"
      - key: AI_ENGINE_URL
        sync: false

      # --- Runtime ---
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: HEALTH_CHECK_TIMEOUT
        value: "15.0"
      # Uvicorn chỉ tin X-Forwarded-For từ các IP trong danh sách này. Render chèn
      # proxy ở biên với IP không cố định → phải tin mọi peer nội bộ (service chỉ
      # truy cập được qua proxy Render). Nhờ vậy `request.client.host` là IP thật
      # của người dùng, rate-limit theo IP mới chính xác (mặc định chỉ 127.0.0.1).
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PYTHONPATH
        value: /app/apps/backend_gateway
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
