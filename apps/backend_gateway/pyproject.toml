[project]
name = "finsim-backend-gateway"
version = "0.1.0"
description = "FinSimAI FastAPI Backend Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0",
    "alembic>=1.13.0,<2.0",
    "asyncpg>=0.29.0,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "PyJWT>=2.8.0,<3.0",
    "bcrypt>=4.0.0,<5.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "email-validator>=2.0.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "grpcio>=1.60.0,<2.0",
    "protobuf>=7.35.1,<8.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5.0.0,<6.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0",
    "wsproto>=1.2.0,<2.0",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "grpcio-tools>=1.62.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

