[project]
name = "finsim-ai-engine"
version = "0.1.0"
description = "FinSimAI AI Engine - mentors, news intelligence & social agents"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0,<2.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "arq>=0.26.0,<1.0",
    "feedparser>=6.0.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "redis>=5.0.0,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "fakeredis>=2.26.0,<3.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
