meta:
  version: "kb-1.0"
  language: vi
  count: 27

concepts:
  pe:
    id: pe
    name: "P/E (Price-to-Earnings)"
    keywords: ["P/E", "P E", "gia tren loi nhuan", "price earnings", "he so PE", "price-to-earnings"]
    definition: "Tỷ lệ giá cổ phiếu chia cho lợi nhuận trên mỗi cổ phần (EPS) — đo mức giá người mua trả cho mỗi đồng lợi nhuận."
    explanation: "P/E cho biết nhà đầu tư sẵn sàng trả bao nhiêu tiền cho mỗi đồng lợi nhuận tạo ra. P/E cao thường phản ánh kỳ vọng tăng trưởng mạnh; P/E thấp có thể là để thị giá rẻ hoặc dấu hiệu tăng trưởng yếu."
    example: "Cổ phiếu giá 100, EPS là 10, thì P/E = 100 / 10 = 10 lần. Tức bạn trả 10 đồng cho mỗi 1 đồng lợi nhuận hàng năm."
    formula: "P/E = Giá / EPS"
    interpretation: "P/E cao chưa hẳn là 'đắt' và P/E thấp chưa hẳn là 'rẻ' — cần so sánh cùng ngành và cùng giai đoạn tăng trưởng."
    related: ["eps", "net_margin", "roe"]
    difficulty: 1
    category: "định giá"
  roe:
    id: roe
    name: "ROE (Return on Equity)"
    keywords: ["ROE", "return on equity", "loi nhuan tren von chu", "loi nhuan tren von chu so huu"]
    definition: "Tỷ suất lợi nhuận trên vốn chủ sở hữu — đo hiệu quả tạo lợi nhuận trên mỗi đồng vốn mà cổ đông bỏ ra."
    explanation: "ROE cao và ổn định nhiều năm thường phản ánh doanh nghiệp hoạt động hiệu quả. Tuy nhiên ROE cao có thể đến từ việc vay nợ nhiều, nên cần nhìn cùng hệ số nợ."
    example: "Doanh nghiệp có lợi nhuận ròng 20 tỷ và vốn chủ 100 tỷ → ROE = 20%."
    formula: "ROE = Lợi nhuận ròng / Vốn chủ sở hữu × 100%"
    interpretation: "ROE cao là tín hiệu tích cực về hiệu quả, nhưng phải kiểm tra nguồn gốc (hiệu quả hay đòn bẩy)."
    related: ["net_margin", "eps", "pe"]
    difficulty: 1
    category: "tài chính doanh nghiệp"
  eps:
    id: eps
    name: "EPS (Earnings Per Share)"
    keywords: ["EPS", "loi nhuan tren moi co phan", "earnings per share"]
    definition: "Lợi nhuận ròng tương ứng với mỗi cổ phiếu đang lưu hành."
    explanation: "EPS là chỉ số cơ bản để đánh giá khả năng sinh lời trên mỗi cổ phần, và là thành phần của nhiều hệ số định giá như P/E."
    example: "Lợi nhuận ròng 100 tỷ và 50 triệu cổ phiếu → EPS = 2.000 đồng/cổ."
    formula: "EPS = Lợi nhuận ròng / Số cổ phiếu lưu hành"
    interpretation: "EPS tăng trưởng theo thời gian thường là dấu hiệu tích cực; cần xét chất lượng lợi nhuận, không chỉ con số."
    related: ["pe", "net_margin", "roe"]
    difficulty: 1
    category: "tài chính doanh nghiệp"
  net_margin:
    id: net_margin
    name: "Biên lợi nhuận ròng (Net Margin)"
    keywords: ["net margin", "bien loi nhuan rong", "bien loi nhuan"]
    definition: "Phần trăm doanh thu còn lại sau mọi chi phí, lãi vay và thuế — đo hiệu quả sinh lời tổng thể."
    explanation: "Net margin cao nghĩa là doanh nghiệp giữ lại được nhiều hơn sau khi thanh toán chi phí. So sánh cùng ngành để đánh giá tương đối."
    example: "Doanh thu 200 tỷ, lợi nhuận ròng 20 tỷ → Net margin = 10%."
    formula: "Net margin = Lợi nhuận ròng / Doanh thu × 100%"
    interpretation: "Biên cao tốt về hiệu quả, nhưng biên thấp có thể chấp nhận nếu mô hình xoay vòng vốn nhanh."
    related: ["roe", "eps", "pe"]
    difficulty: 1
    category: "tài chính doanh nghiệp"
  cut_loss:
    id: cut_loss
    name: "Cắt lỗ (Stop-Loss)"
    keywords: ["cat lo", "stop-loss", "stop loss", "chot lo", "nguong chiu lo"]
    definition: "Mốc hoặc lệnh thoát khỏi vị thế khi lỗ chạm mức định trước, nhằm giới hạn thiệt hại."
    explanation: "Cắt lỗ là kỷ luật quản trị rủi ro giúp tránh để một sai lầm nhỏ trở thành tổn thất lớn. Một kế hoạch đầu tư tốt thường xác định trước mức cắt lỗ."
    example: "Mua ở giá 50 và đặt mốc cắt lỗ 45: nếu giá chạm 45, thoát lệnh để nhận lỗ giới hạn 10%."
    interpretation: "Không có mốc cắt lỗ nào chung cho mọi người — mức hợp lý phụ thuộc khả năng chịu đựng rủi ro và kế hoạch của bạn."
    related: ["risk", "limit_order", "volatility"]
    difficulty: 1
    category: "quản trị rủi ro"
  risk:
    id: risk
    name: "Quản trị rủi ro (Risk Management)"
    keywords: ["quan tri rui ro", "rui ro", "risk management", "risk"]
    definition: "Quy trình nhận diện, đánh giá, giới hạn và xử lý rủi ro trong từng quyết định cũng như toàn danh mục."
    explanation: "Quản trị rủi ro không phải là tránh mọi rủi ro, mà là biết mình đang chấp nhận bao nhiêu và đã chuẩn bị cho kịch bản xấu nhất. Đây là nền tảng của đầu tư kỷ luật."
    example: "Trước khi vào lệnh, xác định rõ: mức lỗ tối đa chấp nhận, tỷ trọng vốn dành cho vị thế, và kịch bản xử lý khi giá đảo chiều."
    interpretation: "Quản trị rủi ro tốt không loại bỏ hoàn toàn rủi ro nhưng giúp tổn thất trong tầm kiểm soát."
    related: ["cut_loss", "diversification", "volatility"]
    difficulty: 1
    category: "quản trị rủi ro"
  diversification:
    id: diversification
    name: "Đa dạng hoá (Diversification)"
    keywords: ["da dang hoa", "da dang hoa", "diversification", "dan trai", "phan bo von"]
    definition: "Phân bổ vốn vào nhiều loại tài sản hoặc cổ phiếu khác nhau để giảm tác động khi một vị thế giảm giá."
    explanation: "Đa dạng hoá giúp giảm rủi ro tập trung nhưng không xoá bỏ rủi ro hệ thống. Mức đa dạng hợp lý phụ thuộc quy mô vốn và hiểu biết của bạn."
    example: "Thay vì dồn toàn bộ vốn vào một cổ phiếu, chia cho 5-10 cổ phiếu thuộc các ngành khác nhau."
    interpretation: "Đa dạng hoá là công cụ quản trị rủi ro; lạm dụng có thể làm loãng lợi nhuận và khó theo dõi."
    related: ["risk", "allocation", "market_cap"]
    difficulty: 1
    category: "quản trị rủi ro"
  allocation:
    id: allocation
    name: "Phân bổ vốn (Allocation)"
    keywords: ["phan bo von", "allocation", "tỷ trọng danh mục", "phan bo tai san"]
    definition: "Cách chia vốn giữa các loại tài sản hoặc vị thế, theo mục tiêu và mức chấp nhận rủi ro."
    explanation: "Phân bổ vốn quyết định phần lớn biến động của danh mục. Cân bằng tiền mặt, trái phiếu, cổ phiếu phù hợp với mục tiêu giúp giảm căng thẳng và rủi ro thua lỗ lớn."
    example: "Danh mục 100 triệu: 60% cổ phiếu vốn hoá lớn, 30% trái phiếu, 10% tiền mặt dự phòng."
    interpretation: "Không có tỷ lệ 'đúng' tuyệt đối — tỷ lệ phụ thuộc mục tiêu, thời gian và khả năng chịu đựng rủi ro của từng người."
    related: ["risk", "diversification", "market_cap"]
    difficulty: 1
    category: "quản trị rủi ro"
  compound_interest:
    id: compound_interest
    name: "Lãi kép (Compound Interest)"
    keywords: ["lai kep", "compound interest", "lai me de lai con"]
    definition: "Lợi nhuận được tái đầu tư để tiếp tục sinh lợi nhuận mới — khiến tài sản tăng trưởng theo cấp số nhân theo thời gian."
    explanation: "Sức mạnh của lãi kép nằm ở thời gian. Bắt đầu sớm dù số tiền nhỏ vẫn có thể tạo kết quả lớn sau nhiều năm nhờ phần lợi nhuận 'đẻ' thêm lợi nhuận."
    example: "Đầu tư 100 triệu với mức sinh lời 10%/năm: sau 20 năm trở thành ~100 × 1.1^20 ≈ 673 triệu nếu không rút ra."
    formula: "Giá trị tương lai = Vốn gốc × (1 + lãi suất)^số kỳ"
    interpretation: "Lãi kép là con dao hai lưỡi với khoản vay: lãi vay cũng kép lên. Hãy để thời gian đứng về phía bạn."
    related: ["time_value", "dividend", "risk"]
    difficulty: 1
    category: "kiến thức nền"
  time_value:
    id: time_value
    name: "Giá trị thời gian của tiền (Time Value of Money)"
    keywords: ["gia tri thoi gian cua tien", "time value of money", "tvom"]
    definition: "Nguyên tắc một đồng hôm nay có giá trị hơn một đồng trong tương lai, vì ngày hôm nay tiền có thể được đầu tư để sinh lời."
    explanation: "Đây là nền tảng của mọi quyết định tài chính: so sánh dòng tiền ở các thời điểm khác nhau cần quy về cùng một thời điểm, thường là hiện tại, qua chiết khấu."
    example: "Nhận 100 triệu ngay bây giờ hay sau 1 năm? 100 triệu hôm nay có thể sinh lời, nên 'lãi' hơn nhận cùng số tiền vào năm sau."
    interpretation: "Khi so sánh các phương án đầu tư, luôn chú ý đến thời điểm của dòng tiền, không chỉ con số thô."
    related: ["compound_interest", "volatility"]
    difficulty: 1
    category: "kiến thức nền"
  market_cap:
    id: market_cap
    name: "Vốn hoá thị trường (Market Cap)"
    keywords: ["von hoa thi truong", "von hoa", "market cap", "marketcap", "gia tri von hoa"]
    definition: "Tổng giá trị thị trường của một công ty = giá cổ phiếu × số cổ phiếu lưu hành."
    explanation: "Vốn hoá giúp phân loại doanh nghiệp theo quy mô (lớn/vừa/nhỏ) — cổ phiếu vốn hoá lớn thường biến động nhẹ hơn, vốn hoá nhỏ tiềm năng cao nhưng rủi ro hơn."
    example: "Cổ phiếu giá 50.000 đồng, có 1 tỷ cổ phiếu → vốn hoá 50.000 tỷ đồng."
    formula: "Market cap = Giá × Số cổ phiếu lưu hành"
    interpretation: "Market cap phản ánh giá thị trường đặt cho công ty tại thời điểm đó, không phải 'giá trị đúng'."
    related: ["pe", "volume", "diversification"]
    difficulty: 1
    category: "định giá"
  dividend:
    id: dividend
    name: "Cổ tức (Dividend)"
    keywords: ["co tuc", "dividend", "chia co tuc", "tien co tuc"]
    definition: "Phần lợi nhuận mà công ty trả cho cổ đông, thường bằng tiền mặt hoặc cổ phiếu."
    explanation: "Cổ tức là một nguồn thu nhập của nhà đầu tư. Doanh nghiệp có thể chọn trả cổ tức hoặc giữ lại để tái đầu tư; cả hai đều là chiến lược hợp lý tuỳ giai đoạn phát triển."
    example: "Công ty trả cổ tức 2.000 đồng/cổ/năm với giá 40.000 → tỷ suất cổ tức 5%/năm."
    formula: "Tỷ suất cổ tức = Cổ tức mỗi cổ / Giá × 100%"
    interpretation: "Tỷ suất cổ tức cao phải cân nhắc cùng sức khoẻ tài chính — nếu công ty vay nợ để trả cổ tức thì khác."
    related: ["compound_interest", "net_margin", "income"]
    difficulty: 1
    category: "kiến thức nền"
  market_order:
    id: market_order
    name: "Lệnh thị trường (Market Order)"
    keywords: ["market order", "lenh thi truong", "lenh market", "mua gia thi truong"]
    definition: "Lệnh mua/bán ngay tại giá khớp lệnh hiện hành — ưu tiên khớp lệnh, không đảm bảo giá."
    explanation: "Lệnh thị trường phù hợp khi cần vào/thoát nhanh và chấp nhận giá thực tế khớp có thể kém hơn giá hiển thị (do trượt giá, nhất là khi khối lượng lớn)."
    example: "Đặt 'mua 1.000 cổ theo giá thị trường' → hệ thống khớp ngay ở giá đối ứng hiện có trên sổ lệnh."
    interpretation: "Nhanh và chắc chắn khớp, nhưng bạn không kiểm soát được giá chính xác."
    related: ["limit_order", "slippage", "volume"]
    difficulty: 1
    category: "giao dịch"
  limit_order:
    id: limit_order
    name: "Lệnh giới hạn (Limit Order)"
    keywords: ["limit order", "lenh gioi han", "lenh limit", "gia gioi han"]
    definition: "Lệnh chỉ khớp ở mức giá bằng hoặc tốt hơn mức bạn đặt — kiểm soát giá nhưng không đảm bảo khớp."
    explanation: "Lệnh giới hạn giúp bạn không trả quá mức mong muốn, nhưng có thể bị bỏ lỡ nếu giá không chạm mức. Là công cụ quan trọng trong kế hoạch giao dịch."
    example: "Đặt lệnh mua 'tối đa 20.000' → chỉ khớp khi giá nhỏ hơn hoặc bằng 20.000."
    interpretation: "Kiểm soát giá tốt hơn lệnh thị trường, nhưng thường không chắc chắn khớp ngay."
    related: ["market_order", "cut_loss", "slippage"]
    difficulty: 1
    category: "giao dịch"
  slippage:
    id: slippage
    name: "Trượt giá (Slippage)"
    keywords: ["truot gia", "slippage"]
    definition: "Chênh lệch giữa giá khớp thực tế và giá dự kiến khi đặt lệnh, do thanh khoản hoặc tốc độ thay đổi giá."
    explanation: "Trượt giá thường gặp khi lệnh lớn hoặc thị trường biến động mạnh. Hiểu về trượt giá giúp bạn đặt lệnh thực tế hơn."
    example: "Giá hiển thị 20.000 nhưng lệnh thị trường khớp ở 20.200 → trượt 200 đồng (1%)."
    interpretation: "Trượt giá không hoàn toàn tránh được; giảm tác động bằng cách dùng lệnh giới hạn và tránh lệnh quá lớn trong thị trường kém thanh khoản."
    related: ["limit_order", "market_order", "volume"]
    difficulty: 2
    category: "giao dịch"
  volume:
    id: volume
    name: "Khối lượng giao dịch (Volume)"
    keywords: ["volume", "khoi luong giao dich", "khoi luong"]
    definition: "Số cổ phiếu được giao dịch trong một khoảng thời gian — phản ánh mức độ quan tâm và thanh khoản."
    explanation: "Giá đi kèm khối lượng lớn thường đáng tin cậy hơn giá đi kèm khối lượng nhỏ. Khối lượng cũng giúp nhận diện sự tham gia của thị trường."
    example: "Hôm nay 2 triệu cổ phiếu được khớp so với trung bình 500 nghìn — cho thấy thanh khoản bất thường."
    interpretation: "Khối lượng cao chưa nói lên xu hướng — cần nhìn kèm giá để hiểu bên nào đang chiếm ưu thế."
    related: ["support_resistance", "liquidity", "trend"]
    difficulty: 1
    category: "phân tích kỹ thuật"
  support_resistance:
    id: support_resistance
    name: "Hỗ trợ & Kháng cự (Support / Resistance)"
    keywords: ["ho tro", "khang cu", "support", "resistance", "nguong", "vung gia"]
    definition: "Các mức giá mà giá có xu hướng dừng giảm (hỗ trợ) hoặc dừng tăng (kháng cự) do tập trung lệnh mua/bán tại đó."
    explanation: "Hỗ trợ và kháng cự là khái niệm tâm lý thị trường, không phải quy luật đảm bảo. Chúng hữu ích khi kết hợp với khối lượng và xu hướng."
    example: "Giá nhiều lần chạm 30.000 rồi bật lên → 30.000 được xem là vùng hỗ trợ."
    interpretation: "Ngưỡng có thể bị phá vỡ; khi phá vỡ thường kèm khối lượng lớn, cần theo dõi không quá cứng nhắc."
    related: ["volume", "trend", "moving_average"]
    difficulty: 2
    category: "phân tích kỹ thuật"
  trend:
    id: trend
    name: "Xu hướng (Trend)"
    keywords: ["xu huong", "trend", "xu the"]
    definition: "Hướng di chuyển chung của giá trong một khoảng thời gian: tăng, giảm hoặc đi ngang."
    explanation: "Nhận diện xu hướng giúp định vị quyết định — giao dịch thuận xu hướng thường được ưa chuộng. Xu hướng có thể đảo chiều bất ngờ nên luôn gắn kèm quản trị rủi ro."
    example: "Giá tạo đáy sau đó tăng cao hơn nhiều lần liên tiếp → xu hướng tăng ngắn hạn."
    interpretation: "Xu hướng có nhiều khung thời gian; xu hướng lớn và nhỏ có thể ngược nhau."
    related: ["moving_average", "support_resistance", "volume"]
    difficulty: 1
    category: "phân tích kỹ thuật"
  moving_average:
    id: moving_average
    name: "Trung bình động (Moving Average)"
    keywords: ["trung binh dong", "moving average", "ma", "duong ma"]
    definition: "Đường trung bình giá trong N phiên liên tiếp, dùng để làm mượt biến động ngắn hạn và nhận diện xu hướng."
    explanation: "Trung bình động không dự đoán giá mà tóm tắt lịch sử. Trung bình động ngắn hạn (5-20 phiên) phản ứng nhanh, dài hạn (50-200 phiên) thể hiện xu hướng nền."
    example: "Tính trung bình động 20 phiên: cộng giá 20 phiên rồi chia 20."
    formula: "MA(N) = Tổng giá N phiên / N"
    interpretation: "MA có độ trễ trong dữ liệu; nên dùng kết hợp nhiều loại và không xem nó là tín hiệu đảm bảo."
    related: ["trend", "support_resistance", "volume"]
    difficulty: 2
    category: "phân tích kỹ thuật"
  liquidity:
