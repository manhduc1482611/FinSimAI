    definition: "Mức độ dao động giá của một tài sản trong một khoảng thời gian."
    explanation: "Biến động cao nghĩa là giá thay đổi mạnh theo cả hai chiều — tiềm năng lợi nhuận lớn kèm rủi ro thua lỗ sâu. Nhà đầu tư nên hiểu rõ biến động của tài sản mình nắm giữ."
    example: "Cổ phiếu A tăng/giảm 1% mỗi phiên biến động thấp hơn cổ phiếu B chênh 5% mỗi phiên."
    interpretation: "Biến động không mang dấu hiệu tốt/xấu một chiều — nó mô tả mức độ dao động, và mức phù hợp phụ thuộc người chơi."
