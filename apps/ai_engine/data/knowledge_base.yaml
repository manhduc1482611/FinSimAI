  fomo:
    id: fomo
    name: "FOMO (Fear Of Missing Out)"
    keywords: ["fomo", "so bo lo", "bo lo co hoi"]
    definition: "Cảm giác sợ bỏ lỡ cơ hội sinh lời khi thấy người khác đang kiếm lợi nhuận."
    explanation: "FOMO thường khiến bạn quyết định vội vàng, không theo kế hoạch, dễ mua đuổi đỉnh. Đây là thiên kiến tâm lý phổ biến và là trọng tâm của phương pháp phản biện Socratic."
    example: "Thấy cả room nói cổ phiếu sắp tăng mạnh, bạn vội mua dù chưa phân tích — đó là FOMO."
    interpretation: "Nhận diện FOMO giúp bạn quay lại với quy trình và kế hoạch thay vì chạy theo đám đông."
    related: ["risk", "trend", "support_resistance"]
    difficulty: 1
    category: "tâm lý"
  herding:
