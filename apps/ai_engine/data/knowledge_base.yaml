    example: "Cổ phiếu có 10 triệu cổ khớp mỗi phiên thường thanh khoản tốt hơn cổ phiếu chỉ khớp 10 nghìn."
    interpretation: "Thanh khoản quan trọng nhất khi bạn cần thoát lệnh — lúc khó khăn mà không khớp được là rủi ro lớn."
