  risk_systematic:
    id: risk_systematic
    name: "Rủi ro hệ thống (Systematic Risk)"
    keywords: ["rui ro he thong", "systematic risk", "rui ro thi truong"]
    definition: "Rủi ro ảnh hưởng toàn thị trường, không thể loại bỏ bằng đa dạng hoá."
    explanation: "Rủi ro hệ thống như suy thoái, thay đổi chính sách lãi suất tác động đến hầu hết cổ phiếu. Khác với rủi ro phi hệ thống (riêng một công ty), nó không biến mất khi bạn nắm nhiều cổ phiếu."
    example: "Một quyết định tăng lãi suất của ngân hàng trung ương làm gần như toàn bộ cổ phiếu điều chỉnh."
    interpretation: "Không thể loại bỏ rủi ro hệ thống hoàn toàn; bạn quản trị nó bằng mức độ tham gia thị trường và kỷ luật cắt lỗ."
    related: ["risk", "diversification", "volatility"]
    difficulty: 2
    category: "quản trị rủi ro"
  alpha_beta:
    id: alpha_beta
    name: "Alpha / Beta"
    keywords: ["alpha", "beta", "he so beta", "alpha beta"]
    definition: "Beta đo độ nhạy cảm của cổ phiếu với biến động thị trường; alpha đo phần lợi nhuận vượt trội so với kỳ vọng từ beta."
    explanation: "Beta = 1 đi cùng thị trường; beta > 1 biến động mạnh hơn; beta < 1 yếu hơn. Alpha dương nghĩa là cổ phiếu/danh mục làm tốt hơn mức kỳ vọng theo rủi ro."
    example: "Beta 1,5: thị trường tăng 10% thì cổ phiếu kỳ vọng tăng 15%; nếu thực tế tăng 18% → alpha dương."
    formula: "Alpha = Lợi nhuận thực tế − (Beta × Lợi nhuận thị trường)"
    interpretation: "Beta và alpha chỉ có ý nghĩa về thống kê trong giai đoạn dài và cần dữ liệu đủ — không phạt người dùng phải tự tính ngay."
    related: ["volatility", "risk", "market_cap"]
    difficulty: 3
    category: "định giá"