    name: "Thiên kiến xác nhận (Confirmation Bias)"
    keywords: ["thien kien xac nhan", "confirmation bias", "chi thay tin tot"]
    definition: "Xu hướng tìm kiếm và tin vào thông tin ủng hộ quan điểm sẵn có, bỏ qua thông tin ngược lại."
    explanation: "Thiên kiến xác nhận khiến bạn tự xây 'bức tường' bảo vệ một quyết định dù dữ liệu mâu thuẫn. Cách đối phó: chủ động tìm ý kiến trái chiều."
    example: "Bạn đã mua cổ X nên chỉ đọc tin tích cực về X và bỏ qua cảnh báo rủi ro."
    interpretation: "Biết mình có thiên kiến là bước đầu để đưa quyết định khách quan hơn."
