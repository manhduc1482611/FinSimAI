    definition: "Đánh giá quá cao độ chính xác nhận định hoặc kỹ năng ra quyết định của bản thân."
    explanation: "Quá tự tin thường đến sau vài lần đúng liên tiếp. Nó khiến bạn giao dịch khối lượng lớn hơn và bỏ qua kế hoạch phòng ngừa."
