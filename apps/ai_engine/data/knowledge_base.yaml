#   interpretation, related, difficulty (1-3), category
#
# Nguyên tắc:
# - definition: ngắn gọn, chuẩn mực.
# - explanation: 2-4 câu dễ hiểu cho người mới.
# - example: ví dụ số học trực quan (nếu có).
# - interpretation: diễn giải NEUTRAL — KHÔNG phán xét tốt/xấu tuyệt đối.
