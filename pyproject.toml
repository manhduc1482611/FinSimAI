[project]
name = "finsimai"
version = "0.1.0"
description = "FinSimAI - Financial Simulation & AI Mentor Platform"
requires-python = ">=3.11"

[tool.uv]
dev-dependencies = ["ruff>=0.3.0", "mypy>=1.8.0"]

[tool.uv.workspace]
members = [
    "apps/backend_gateway",
    "apps/math_engine",
    "apps/ai_engine",
    "packages/database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "apps/backend_gateway/clients/proto/",
    "apps/backend_gateway/grpc_services/*_pb2*.py",
    "apps/math_engine/grpc_services/*_pb2*.py",
    "packages/database/migrations/versions/",
    "tmp_check_cors.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [
    "^apps/backend_gateway/clients/proto/",
    "^apps/backend_gateway/grpc_services/",
    "^apps/math_engine/grpc_services/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
