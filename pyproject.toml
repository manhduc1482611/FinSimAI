[project]
name = "finsimai"
version = "0.1.0"
description = "FinSimAI - Financial Simulation & AI Mentor Platform"
requires-python = ">=3.11"

[tool.uv]
dev-dependencies = ["ruff>=0.3.0", "mypy>=1.8.0"]

[tool.uv.workspace]
members = [
    "apps/backend_gateway",
    "apps/math_engine",
    "apps/ai_engine",
    "packages/database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "apps/backend_gateway/clients/proto/",
    "apps/backend_gateway/grpc_services/*_pb2*.py",
    "apps/math_engine/grpc_services/*_pb2*.py",
    "packages/database/migrations/versions/",
    "tmp_check_cors.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
# Bỏ qua mã sinh tự động / gRPC cũ / migration / test khỏi cổng mypy strict.
# Regex dùng literal string để giữ nguyên `[\\/]` (khớp cả `\` Windows lẫn `/` Linux).
exclude = [
    'apps[/\\]backend_gateway[/\\]clients[/\\]proto[/\\]',
    'apps[/\\]backend_gateway[/\\]grpc_services[/\\]',
    'apps[/\\]math_engine[/\\]grpc_services[/\\]',
    'apps[/\\]math_engine[/\\]grpc_server\.py',
    'apps[/\\].*[/\\]tests[/\\]',
    'packages[/\\]database[/\\]migrations[/\\]versions[/\\]',
]

# ── Baseline mypy strict ─────────────────────────────────────────────────────
# Các module dưới đây còn "nợ" type cũ (chủ yếu `type-arg` cho generic và
# `arg-type` với SQLAlchemy/FastAPI). Chúng được MIỄN LỖI để cổng CI xanh NGAY,
# đồng thời mọi module KHÁC (kể cả code mới) vẫn bị mypy strict gác. Khi dọn nợ,
# xóa dần tên khỏi danh sách này — đừng thêm mới. (TODO #16.)
[[tool.mypy.overrides]]
module = [
    # backend_gateway
    "realtime.mentor_engine",
    "realtime.mentor_ws",
    "services.mentor_metadata",
    "services.mentor_history",
    "services.task_service",
    "services.report_service",
    "services.challenge_service",
    "services.leaderboard_service",
    "services.corporate_events",
    "api.v1.ai_sync",
    "api.v1.challenges",
    "api.v1.mentor_history",
    "api.v1.leaderboard",
    "api.v1.discipline",
    "api.v1.reports",
    "models.mentor",
    "models.challenge",
    "core.metrics",
    # ai_engine
    "agents.socratic_mentor",
    "agents.intent",
    "run_tasks",
    "tasks.worker",
    "tasks.scenario_tasks",
    "prompts.loader",
    "integrations.news_sources",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
